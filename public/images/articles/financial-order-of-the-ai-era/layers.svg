<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 439" width="860" height="439"><title>机器公司的四笔账 / Four claims on the same firm’s cash flow</title><rect x="0" y="0" width="860" height="439" fill="#f5f3eb" /><text x="32" y="49" fill="#19322e" font-size="30" font-family="system-ui,sans-serif">机器公司的四笔账</text><text x="32" y="80" fill="#34605b" font-size="21" font-family="system-ui,sans-serif">Four claims on the same firm’s cash flow</text><rect x="32" y="106" width="796" height="66" fill="#e1eae4" /><text x="46" y="134" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">支付</text><text x="46" y="159" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Payments</text><text x="280" y="134" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">当期账单与兑付</text><text x="280" y="159" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Invoice settlement and redemption</text><rect x="32" y="183" width="796" height="66" fill="#e1eae4" /><text x="46" y="211" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">生产资本</text><text x="46" y="236" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Productive capital</text><text x="280" y="211" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">未来算力按约交割</text><text x="280" y="236" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Delivery of contracted compute</text><rect x="32" y="260" width="796" height="66" fill="#e1eae4" /><text x="46" y="288" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">长期储备</text><text x="46" y="313" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Reserves</text><text x="280" y="288" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">购买力与产权保护</text><text x="280" y="313" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Purchasing power and control of assets</text><rect x="32" y="337" width="796" height="66" fill="#e1eae4" /><text x="46" y="365" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">安全支出</text><text x="46" y="390" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Security spending</text><text x="280" y="365" fill="#19322e" font-size="22" font-family="system-ui,sans-serif">手续费流向矿工，托管费流向托管人</text><text x="280" y="390" fill="#19322e" font-size="17" font-family="system-ui,sans-serif">Fees to miners, custody charges to custodians</text></svg>